aid: calyptia
name: Calyptia
description: >-
  Calyptia builds Calyptia Cloud (Telemetry Pipeline) and Calyptia Core, a
  commercial management plane for Fluent Bit — the widely deployed open-source
  agent and processor for logs, metrics and traces. The Calyptia Cloud API lets
  teams create and operate core instances, telemetry pipelines, agent fleets,
  processing rules and live trace sessions programmatically, authenticated with
  project API tokens. Calyptia was founded by the creators of Fluent Bit and
  Fluentd and was acquired by Chronosphere in 2024; calyptia.com and the product
  docs now route to chronosphere.io, but the Calyptia Cloud API
  (cloud-api.calyptia.com), its API reference, status page, Go client and the
  `calyptia` CLI remain live and actively released. Backed by Sierra Ventures.
