      - utilizationMemoryAverage
    PipelineEvent:
      type: object
      description: Pipeline Status event.
      properties:
        source:
          type: string
          enum:
          - k8s:deployment
          - k8s:pod
        reason:
          type: string
        message:
          type: string
        loggedAt:
          type: string
          format: date-time
      required:
      - source
      - reason
      - loggedAt
    Affinity:
      type: object
      properties:
        key:
          type: string
        operator:
          $ref: '#/components/schemas/NodeSelectorOperator'
