          nullable: true
        storageClass:
          type: string
          description: Represents the storageClass for PVC templates
          nullable: true
        pvcRetentionPolicy:
          $ref: '#/components/schemas/PVCRetentionPolicy'
          nullable: true
      required:
      - name
      - replicasCount
      - rawConfig
      - image
