      - labelSelector
      - minDomains
    CreatePipeline:
      description: Create pipeline request body.
      type: object
      properties:
        name:
          type: string
          description: DNS label format as of defined on RFC1123
          example: new-pipeline
        kind:
          $ref: '#/components/schemas/PipelineKind'
        replicasCount:
          type: integer
          minimum: 0
        rawConfig:
          type: string
        configFormat:
          $ref: '#/components/schemas/ConfigFormat'
