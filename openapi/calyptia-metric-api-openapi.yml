          '
        schema:
          type: string
          format: duration
          default: 1h
      - name: pipeline_id
        required: true
        in: query
        description: List of pipeline IDs.
        schema:
          type: array
          items:
            type: string
            format: uuid
      security:
      - user: []
      - project: []
      summary: Core instance pipelines metrics (bulk)
      deprecated: true
      operationId: aggregatorPipelinesMetrics
      tags:
      - metric
      responses:
        '200':
          description: OK
          headers:
            Sunset:
