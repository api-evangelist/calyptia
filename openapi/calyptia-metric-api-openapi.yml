      deprecated: true
      operationId: pipelineMetricsV1
      description: 'Contains an overview of the aggregated metrics for a pipeline.

        It includes metrics link the amount of records, bytes, and errors per plugin.'
      security:
      - user: []
      - project: []
      parameters:
      - schema:
          type: string
          format: duration
          default: -24h
        name: start
        in: query
      - schema:
