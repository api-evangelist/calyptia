          format: duration
          default: 1h
        name: interval
        in: query
      responses:
        '200':
          description: OK
          headers:
            Sunset:
              schema:
                type: string
                example: Tue, 01 Nov 2022 00:00:00 GMT
              description: RFC1123 date when the endpoint will be removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMetrics'
  /v1/aggregator_metrics/{aggregatorID}:
    parameters:
    - name: aggregatorID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      parameters:
      - name: start
        required: false
        in: query
        description: 'Option to filter metrics since the given time ago

          '
        schema:
          type: string
          format: duration
          default: -24h
      - name: interval
        required: false
        in: query
        description: 'Option to set the time window to group metrics

          '
        schema:
          type: string
          format: duration
          default: 1h
      security:
      - user: []
      - project: []
      summary: Core instance metrics
      deprecated: true
      operationId: aggregatorMetrics
      tags:
      - metric
      responses:
        '200':
          description: OK
          headers:
            Sunset:
              schema:
                type: string
                example: Tue, 01 Nov 2022 00:00:00 GMT
              description: RFC1123 date when the endpoint will be removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregatorMetrics'
  /v1/aggregators/{aggregatorID}/pipelines_metrics:
    parameters:
    - name: aggregatorID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
