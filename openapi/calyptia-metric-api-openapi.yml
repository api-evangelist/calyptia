openapi: 3.0.4
info:
  title: Calyptia Cloud agent metric API
  version: '1.0'
  description: HTTP API service of Calyptia Cloud
  contact:
    name: Calyptia
    email: hello@calyptia.com
    url: https://cloud.calyptia.com
  termsOfService: https://calyptia.com/terms/
servers:
- url: https://cloud-api.calyptia.com
  description: prod
- url: https://cloud-api-dev.calyptia.com
  description: dev
- url: https://cloud-api-staging.calyptia.com
  description: staging
- url: http://localhost:{port}
  description: local
  variables:
    port:
      default: '5000'
tags:
- name: metric
paths:
  /v1/projects/{projectID}/metrics:
    parameters:
    - schema:
        type: string
        format: uuid
      name: projectID
      in: path
      required: true
    get:
      tags:
      - metric
      summary: Project metrics
      deprecated: true
      operationId: projectMetrics
      description: 'Contains an overview of the aggregated metrics for a project.

        It includes metrics link the amount of records, bytes, and errors per plugin.'
      security:
      - user: []
      - project: []
      parameters:
      - schema:
          type: string
          format: duration
          default: -24h
        name: start
        in: query
      - schema:
          type: string
          format: duration
          default: 1h
        name: interval
        in: query
      responses:
        '200':
          description: OK
          headers:
            Sunset:
              schema:
                type: string
                example: Tue, 01 Nov 2022 00:00:00 GMT
              description: RFC1123 date when the endpoint will be removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMetrics'
  /v1/agents/{agentID}/metrics:
    parameters:
    - schema:
        type: string
        format: uuid
      name: agentID
      in: path
      required: true
    get:
      tags:
      - metric
      summary: Agent metrics
      deprecated: true
      operationId: agentMetricsV1
      description: 'Contains an overview of the aggregated metrics for an agent.

        It includes metrics link the amount of records, bytes, and errors per plugin.'
      security:
      - user: []
      - project: []
      parameters:
      - schema:
          type: string
          format: duration
          default: -24h
        name: start
        in: query
      - schema:
          type: string
          format: duration
          default: 1h
        name: interval
        in: query
      responses:
        '200':
          description: OK
          headers:
            Sunset:
              schema:
                type: string
                example: Tue, 01 Nov 2022 00:00:00 GMT
              description: RFC1123 date when the endpoint will be removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMetrics'
  /v1/pipeline_metrics/{pipelineID}:
    parameters:
    - schema:
        type: string
        format: uuid
      name: pipelineID
      in: path
      required: true
    get:
      tags:
